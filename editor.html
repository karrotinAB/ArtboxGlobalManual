<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>매뉴얼 편집기 (관리자 전용)</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--blush-100); }
  .editor-shell { display: flex; height: 100vh; }
  .form-pane {
    width: 460px; flex-shrink: 0; overflow-y: auto;
    padding: 20px; background: #fff; border-right: 1px solid rgba(185,62,62,0.15);
  }
  .preview-pane { flex: 1; overflow-y: auto; }
  .gate {
    max-width: 360px; margin: 120px auto; padding: 32px;
    background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
    text-align: center;
  }
  .gate input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd; margin: 14px 0; font-size: 15px; }
  .gate button, .toolbar button {
    background: var(--coral-900); color: #fff; border: none; border-radius: var(--radius-pill);
    padding: 10px 18px; font-family: inherit; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .gate .note, .form-pane .note { font-size: 12px; color: #948b89; line-height: 1.5; }
  .field-label { font-size: 12px; font-weight: 700; color: var(--coral-900); margin: 14px 0 4px; display:block; }
  .form-pane input[type=text], .form-pane textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #e6d9d7; border-radius: 8px;
    font-family: inherit; font-size: 13px; margin-bottom: 6px; resize: vertical;
  }
  .chapter-block { border: 1.5px solid var(--blush-200); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  .section-block { background: var(--blush-100); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .small-btn {
    font-size: 12px; padding: 5px 10px; border-radius: var(--radius-pill);
    border: 1px solid var(--coral-400); background: #fff; color: var(--coral-900); cursor: pointer; margin: 4px 4px 0 0;
  }
  .small-btn.danger { border-color: #c0392b; color: #c0392b; }
  .toolbar {
    display: flex; gap: 8px; align-items: center; justify-content: space-between;
    padding: 10px 20px; background: #fff; border-bottom: 1px solid rgba(185,62,62,0.12);
  }
  .toolbar .lang-toggle { position: static; }
  #fileInput { display: none; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2 style="margin-top:0;">🔒 편집자 로그인</h2>
  <p class="note">이 페이지는 콘텐츠 편집 전용이며 검색엔진에도 노출되지 않아요.<br>단, 정적 사이트라 완전한 보안은 아니니 URL을 외부에 공유하지 마세요.</p>
  <input type="password" id="passcodeInput" placeholder="비밀번호 입력">
  <button onclick="tryUnlock()">입장</button>
  <p class="note" id="gateError" style="color:#c0392b;"></p>
</div>

<div class="editor-shell" id="editorShell" style="display:none;">
  <div class="form-pane">
    <div class="toolbar" style="padding:0 0 12px 0;">
      <strong>콘텐츠 편집</strong>
      <div>
        <button class="small-btn" onclick="loadJsonFile()">JSON 불러오기</button>
        <button class="small-btn" onclick="exportJson()" style="background:var(--coral-900);color:#fff;">내보내기 ⤓</button>
      </div>
    </div>
    <input type="file" id="fileInput" accept="application/json">
    <p class="note">여기서 수정하면 오른쪽 미리보기에 실시간 반영돼요. 다 고치면 <b>내보내기</b>로 content.json을 받아서, 저장소의 기존 content.json에 덮어쓰기 해주세요. (이미지 파일은 images 폴더에 같은 파일명으로 직접 업로드)</p>

    <div id="chapterForms"></div>
    <button class="small-btn" onclick="addChapter()">+ 챕터 추가</button>
  </div>

  <div class="preview-pane">
    <div class="toolbar">
      <div class="lang-toggle">
        <button id="pv-btn-ko" class="active" onclick="switchPreviewLang('ko')">한국어 미리보기</button>
        <button id="pv-btn-en" onclick="switchPreviewLang('en')">EN 미리보기</button>
      </div>
    </div>
    <div id="previewRoot"></div>
  </div>
</div>

<script src="render.js"></script>
<script>
// ⚠️ 클라이언트 측 비밀번호이며, 완전한 접근 제어가 아니라 '가벼운 잠금'입니다.
// 더 강한 보호가 필요하면 저장소를 private로 두거나 별도 인증을 붙이는 것을 권장해요.
const EDITOR_PASSCODE = 'artbox2026';

function tryUnlock() {
  const val = document.getElementById('passcodeInput').value;
  if (val === EDITOR_PASSCODE) {
    sessionStorage.setItem('manualEditorAuth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('editorShell').style.display = 'flex';
    initEditor();
  } else {
    document.getElementById('gateError').textContent = '비밀번호가 올바르지 않아요.';
  }
}

if (sessionStorage.getItem('manualEditorAuth') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('editorShell').style.display = 'flex';
  window.addEventListener('DOMContentLoaded', initEditor);
}

let data = null;
let previewLang = 'ko';

function initEditor() {
  fetch('content.json?_=' + Date.now())
    .then(r => r.json())
    .then(json => { data = json; renderForms(); renderPreview(); })
    .catch(() => { data = { meta: { siteTitle: {ko:'',en:''}, subtitle: {ko:'',en:''}, logo:'ARTBOX' }, chapters: [] }; renderForms(); renderPreview(); });
}

function renderPreview() {
  renderSite(document.getElementById('previewRoot'), data, previewLang);
}

function switchPreviewLang(l) {
  previewLang = l;
  document.getElementById('pv-btn-ko').classList.toggle('active', l === 'ko');
  document.getElementById('pv-btn-en').classList.toggle('active', l === 'en');
  renderPreview();
}

function renderForms() {
  const wrap = document.getElementById('chapterForms');
  wrap.innerHTML = '';
  data.chapters.forEach((chapter, ci) => {
    const block = document.createElement('div');
    block.className = 'chapter-block';
    block.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>챕터 ${chapter.num || ci+1}</strong>
        <button class="small-btn danger" data-act="del-chapter" data-ci="${ci}">챕터 삭제</button>
      </div>
      <label class="field-label">번호 / 아이콘</label>
      <div class="row-2">
        <input type="text" data-bind="chapter.num" data-ci="${ci}" value="${esc(chapter.num)}">
        <input type="text" data-bind="chapter.icon" data-ci="${ci}" value="${esc(chapter.icon)}">
      </div>
      <label class="field-label">챕터 제목 (한 / EN)</label>
      <div class="row-2">
        <input type="text" data-bind="chapter.title.ko" data-ci="${ci}" value="${esc(chapter.title.ko)}">
        <input type="text" data-bind="chapter.title.en" data-ci="${ci}" value="${esc(chapter.title.en)}">
      </div>
      <div id="sections-${ci}"></div>
      <button class="small-btn" data-act="add-section" data-ci="${ci}">+ 섹션 추가</button>
    `;
    wrap.appendChild(block);

    const secWrap = block.querySelector(`#sections-${ci}`);
    chapter.sections.forEach((sec, si) => {
      const sb = document.createElement('div');
      sb.className = 'section-block';
      sb.innerHTML = `
        <div style="display:flex;justify-content:space-between;">
          <span style="font-size:12px;font-weight:700;">섹션 ${sec.num}</span>
          <button class="small-btn danger" data-act="del-section" data-ci="${ci}" data-si="${si}">삭제</button>
        </div>
        <label class="field-label">번호</label>
        <input type="text" data-bind="section.num" data-ci="${ci}" data-si="${si}" value="${esc(sec.num)}">
        <label class="field-label">섹션 제목 (한 / EN)</label>
        <div class="row-2">
          <input type="text" data-bind="section.title.ko" data-ci="${ci}" data-si="${si}" value="${esc(sec.title.ko)}">
          <input type="text" data-bind="section.title.en" data-ci="${ci}" data-si="${si}" value="${esc(sec.title.en)}">
        </div>
        <label class="field-label">설명 (한 / EN — 한 줄에 하나씩)</label>
        <div class="row-2">
          <textarea rows="4" data-bind="section.bullets.ko" data-ci="${ci}" data-si="${si}">${esc((sec.bullets.ko||[]).join('\n'))}</textarea>
          <textarea rows="4" data-bind="section.bullets.en" data-ci="${ci}" data-si="${si}">${esc((sec.bullets.en||[]).join('\n'))}</textarea>
        </div>
        <label class="field-label">이미지</label>
        <div data-images="${ci}-${si}">
          ${(sec.images||[]).map((im, ii) => `
            <div class="row-2" style="margin-bottom:4px;" data-image-row="${ii}">
              <input type="text" placeholder="images/파일명.jpg" data-bind="image.src" data-ci="${ci}" data-si="${si}" data-ii="${ii}" value="${esc(im.src)}">
              <input type="text" placeholder="캡션(한)" data-bind="image.caption.ko" data-ci="${ci}" data-si="${si}" data-ii="${ii}" value="${esc(im.caption.ko)}">
            </div>
          `).join('')}
        </div>
        <button class="small-btn" data-act="add-image" data-ci="${ci}" data-si="${si}">+ 이미지 추가</button>
      `;
      secWrap.appendChild(sb);
    });
  });

  wrap.querySelectorAll('[data-bind]').forEach(el => {
    el.addEventListener('input', onFieldInput);
  });
  wrap.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', onAction);
  });
}

function esc(s) { return (s || '').toString().replace(/"/g, '&quot;'); }

function onFieldInput(e) {
  const el = e.target;
  const ci = el.dataset.ci !== undefined ? parseInt(el.dataset.ci) : null;
  const si = el.dataset.si !== undefined ? parseInt(el.dataset.si) : null;
  const ii = el.dataset.ii !== undefined ? parseInt(el.dataset.ii) : null;
  const path = el.dataset.bind;
  const val = el.value;

  if (path === 'chapter.num') data.chapters[ci].num = val;
  else if (path === 'chapter.icon') data.chapters[ci].icon = val;
  else if (path === 'chapter.title.ko') data.chapters[ci].title.ko = val;
  else if (path === 'chapter.title.en') data.chapters[ci].title.en = val;
  else if (path === 'section.num') data.chapters[ci].sections[si].num = val;
  else if (path === 'section.title.ko') data.chapters[ci].sections[si].title.ko = val;
  else if (path === 'section.title.en') data.chapters[ci].sections[si].title.en = val;
  else if (path === 'section.bullets.ko') data.chapters[ci].sections[si].bullets.ko = val.split('\n').filter(Boolean);
  else if (path === 'section.bullets.en') data.chapters[ci].sections[si].bullets.en = val.split('\n').filter(Boolean);
  else if (path === 'image.src') data.chapters[ci].sections[si].images[ii].src = val;
  else if (path === 'image.caption.ko') data.chapters[ci].sections[si].images[ii].caption.ko = val;

  renderPreview();
}

function onAction(e) {
  const el = e.target;
  const act = el.dataset.act;
  const ci = el.dataset.ci !== undefined ? parseInt(el.dataset.ci) : null;
  const si = el.dataset.si !== undefined ? parseInt(el.dataset.si) : null;

  if (act === 'del-chapter') { data.chapters.splice(ci, 1); }
  else if (act === 'add-section') {
    data.chapters[ci].sections.push({
      num: String(data.chapters[ci].sections.length + 1),
      title: { ko: '새 섹션', en: 'New Section' },
      bullets: { ko: [], en: [] },
      images: []
    });
  }
  else if (act === 'del-section') { data.chapters[ci].sections.splice(si, 1); }
  else if (act === 'add-image') {
    data.chapters[ci].sections[si].images.push({ src: 'images/new.jpg', caption: { ko: '', en: '' } });
  }
  renderForms();
  renderPreview();
}

function addChapter() {
  data.chapters.push({
    num: String(data.chapters.length + 1).padStart(2, '0'),
    icon: '⭐',
    title: { ko: '새 챕터', en: 'New Chapter' },
    sections: []
  });
  renderForms();
  renderPreview();
}

function exportJson() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'content.json';
  a.click();
}

function loadJsonFile() {
  document.getElementById('fileInput').click();
}
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      data = JSON.parse(reader.result);
      renderForms();
      renderPreview();
    } catch (err) {
      alert('JSON 형식을 읽을 수 없어요.');
    }
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
